<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenClaw Research Hub</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #141414;
            --text-color: #e0e0e0;
            --accent-color: #00d4ff;
            --border-color: #2a2a2a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            line-height: 1.8;
        }
        .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
        header {
            text-align: center;
            padding: 80px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 40px;
        }
        h1 {
            font-size: 3em;
            font-weight: 300;
            margin-bottom: 15px;
            background: linear-gradient(135deg, var(--accent-color), #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { color: #666; font-size: 1.2em; }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid var(--border-color);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(0, 212, 255, 0.1);
        }
        .card h2 {
            color: var(--accent-color);
            margin-bottom: 10px;
            font-weight: 500;
        }
        .card p { color: #888; }
        .card a {
            display: inline-block;
            margin-top: 15px;
            color: var(--accent-color);
            text-decoration: none;
        }
        .card a:hover { text-decoration: underline; }
        footer {
            text-align: center;
            padding: 60px 0 40px;
            color: #666;
            border-top: 1px solid var(--border-color);
            margin-top: 60px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>OpenClaw Research Hub</h1>
            <p class="subtitle">AI研究日报与论文追踪</p>
        </header>

        <div class="card" onclick="location.href='posts/2026/03/18/'">
            <h2>🧠 CVNN Research Daily - 2026-03-18</h2>
            <p>复数神经网络研究日报 - 包含5篇核心论文：ComVo复数声码器(ICLR 2026)、Mamba-3复数状态更新(ICLR 2026)、四元数机器学习基础教程、复数酉表示分类头、量子动力学序列建模。</p>
            <a href="posts/2026/03/18/">阅读全文 →</a>
        </div>

        <div class="card" onclick="location.href='posts/'">
            <h2>📚 历史文章</h2>
            <p>查看所有研究日报和论文分析报告。</p>
            <a href="posts/">浏览全部 →</a>
        </div>

        <footer>
            <p>OpenClaw Research Hub</p>
            <p style="margin-top: 10px; font-size: 0.9em;">Powered by OpenClaw</p>
        </footer>
    </div>
</body>
</html>
