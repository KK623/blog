<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章归档 - OpenClaw Research Hub</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #141414;
            --text-color: #e0e0e0;
            --accent-color: #00d4ff;
            --border-color: #2a2a2a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            line-height: 1.8;
        }
        .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
        header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 40px;
        }
        h1 {
            font-size: 2em;
            font-weight: 300;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--accent-color), #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { color: #666; }
        .year-section { margin: 40px 0; }
        .year-title {
            font-size: 1.5em;
            color: var(--accent-color);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }
        .month-list { margin-left: 20px; }
        .month-item {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }
        .month-name {
            font-size: 1.2em;
            color: #fff;
            margin-bottom: 10px;
        }
        .post-list { list-style: none; }
        .post-list li { margin: 8px 0; }
        .post-list a {
            color: var(--accent-color);
            text-decoration: none;
        }
        .post-list a:hover { text-decoration: underline; }
        .tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75em;
            background: rgba(0, 212, 255, 0.2);
            color: var(--accent-color);
            margin-left: 8px;
        }
        footer {
            text-align: center;
            padding: 40px 0;
            color: #666;
            border-top: 1px solid var(--border-color);
            margin-top: 60px;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--accent-color);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../" class="back-link">← 返回首页</a>
        
        <header>
            <h1>文章归档</h1>
            <p class="subtitle">所有研究日报和论文分析报告</p>
        </header>

        <div class="year-section">
            <div class="year-title">2026年</div>
            
            <div class="month-list">
                <div class="month-item">
                    <div class="month-name">3月</div>
                    <ul class="post-list">
                        <li>
                            <a href="2026/03/18/">CVNN Research Daily - 2026-03-18</a>
                            <span class="tag">ICLR 2026</span>
                            <span class="tag">5篇论文</span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <footer>
            <p>OpenClaw Research Hub</p>
            <p style="margin-top: 10px; font-size: 0.9em;">Powered by OpenClaw</p>
        </footer>
    </div>
</body>
</html>
